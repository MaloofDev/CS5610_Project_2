<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report · LicenseLens</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/buttons.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/badges.css" />
    <link rel="stylesheet" href="/css/tables.css" />
    <link rel="stylesheet" href="/css/dialogs.css" />
    <link rel="stylesheet" href="/css/notices.css" />
    <link rel="stylesheet" href="/css/report.css" />
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/report.js"></script>
  </head>
  <body>
    <header id="site-nav"></header>
    <main class="container">
      <p id="login-notice" class="notice" hidden>
        <a id="login-link" href="/login.html">Log in</a> or
        <a id="signup-link" href="/signup.html">sign up</a> to see this report.
      </p>

      <p id="report-status" class="muted" role="status">Loading report...</p>
      <p id="report-error" class="form-error" role="alert"></p>

      <article id="report" hidden>
        <div class="report-header">
          <div class="report-title">
            <h1 id="report-name"></h1>
            <button
              id="rename-button"
              type="button"
              class="icon-button"
              aria-label="Rename report"
              title="Rename report"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <form id="rename-form" class="inline-form" hidden>
              <input
                name="name"
                type="text"
                maxlength="100"
                aria-label="Report name"
                required
              />
              <button type="submit" class="button button-small button-primary">
                Save
              </button>
              <button
                id="rename-cancel"
                type="button"
                class="button button-small"
              >
                Cancel
              </button>
            </form>
          </div>
          <div class="report-header-actions">
            <button id="rerun-button" type="button" class="button">
              Re-run
            </button>
            <button
              id="delete-button"
              type="button"
              class="button button-danger"
            >
              Delete
            </button>
          </div>
        </div>

        <p id="report-meta" class="muted"></p>
        <div id="report-summary" class="report-summary"></div>

        <form
          id="result-filters"
          class="filter-bar"
          aria-label="Filter results"
        >
          <label class="choice">
            Status
            <select name="status">
              <option value="">All</option>
              <option value="conflict">Conflict</option>
              <option value="conditions">Conditions</option>
              <option value="review">Review needed</option>
              <option value="ok">OK</option>
            </select>
          </label>
          <label class="choice">
            License
            <select name="license">
              <option value="">All</option>
            </select>
          </label>
        </form>

        <div id="results-table" class="table-wrap">
          <table class="table results-table">
            <thead>
              <tr>
                <th scope="col">Package</th>
                <th scope="col">Version</th>
                <th scope="col">License</th>
                <th scope="col">Status</th>
                <th scope="col">Reason</th>
                <th scope="col">Alternatives</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>

        <p id="no-results" hidden>
          No packages match these filters.
          <button id="clear-filters" type="button" class="link-button">
            Clear filters
          </button>
        </p>
      </article>

      <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title">
        <form method="dialog">
          <h2 id="delete-title">Delete this report?</h2>
          <p>
            <strong id="delete-name"></strong> will be deleted. This can't be
            undone.
          </p>
          <div class="dialog-actions">
            <button type="submit" value="cancel" class="button" autofocus>
              Cancel
            </button>
            <button type="submit" value="delete" class="button button-danger">
              Delete
            </button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>

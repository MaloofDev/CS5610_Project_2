<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report · LicenseLens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/report.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <header id="site-nav"></header>
    <main class="container py-4">
      <p id="login-notice" class="alert alert-warning" hidden>
        <a id="login-link" class="alert-link" href="/login.html">Log in</a> or
        <a id="signup-link" class="alert-link" href="/signup.html">sign up</a>
        to see this report.
      </p>

      <p id="report-status" class="text-body-secondary" role="status">
        Loading report...
      </p>
      <p id="report-error" class="text-danger" role="alert"></p>

      <article id="report" hidden>
        <div
          class="d-flex flex-wrap align-items-start justify-content-between column-gap-4 row-gap-3 mb-2"
        >
          <div class="d-flex flex-grow-1 align-items-center gap-2">
            <h1 id="report-name" class="h2 mb-0"></h1>
            <button
              id="rename-button"
              type="button"
              class="btn btn-sm btn-link link-secondary p-1"
              aria-label="Rename report"
              title="Rename report"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <form id="rename-form" class="hstack flex-grow-1 gap-2" hidden>
              <input
                name="name"
                type="text"
                class="form-control"
                maxlength="100"
                aria-label="Report name"
                required
              />
              <button type="submit" class="btn btn-primary">Save</button>
              <button
                id="rename-cancel"
                type="button"
                class="btn btn-outline-secondary"
              >
                Cancel
              </button>
            </form>
          </div>
          <div class="d-flex gap-2">
            <button
              id="rerun-button"
              type="button"
              class="btn btn-outline-secondary"
            >
              Re-run
            </button>
            <button
              id="delete-button"
              type="button"
              class="btn btn-outline-danger"
            >
              Delete
            </button>
          </div>
        </div>

        <p id="report-meta" class="text-body-secondary"></p>
        <div id="report-summary" class="mb-3"></div>

        <form
          id="result-filters"
          class="hstack flex-wrap column-gap-4 row-gap-2 mb-3"
          aria-label="Filter results"
        >
          <label class="hstack gap-2">
            Status
            <select name="status" class="form-select form-select-sm w-auto">
              <option value="">All</option>
              <option value="conflict">Conflict</option>
              <option value="conditions">Conditions</option>
              <option value="review">Review needed</option>
              <option value="ok">OK</option>
            </select>
          </label>
          <label class="hstack gap-2">
            License
            <select name="license" class="form-select form-select-sm w-auto">
              <option value="">All</option>
            </select>
          </label>
        </form>

        <div
          id="results-table"
          class="table-responsive table-card border rounded bg-body shadow-sm"
        >
          <table class="table align-top mb-0 results-table">
            <thead class="table-light">
              <tr>
                <th scope="col">Package</th>
                <th scope="col">Version</th>
                <th scope="col">License</th>
                <th scope="col">Status</th>
                <th scope="col">Reason</th>
                <th scope="col">Alternatives</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>

        <p id="no-results" hidden>
          No packages match these filters.
          <button
            id="clear-filters"
            type="button"
            class="btn btn-link p-0 align-baseline"
          >
            Clear filters
          </button>
        </p>
      </article>

      <dialog
        id="delete-dialog"
        class="dialog border rounded-3 shadow p-4 bg-body text-body"
        aria-labelledby="delete-title"
      >
        <form method="dialog">
          <h2 id="delete-title" class="h4">Delete this report?</h2>
          <p>
            <strong id="delete-name"></strong> will be deleted. This can't be
            undone.
          </p>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button
              type="submit"
              value="cancel"
              class="btn btn-outline-secondary"
              autofocus
            >
              Cancel
            </button>
            <button type="submit" value="delete" class="btn btn-danger">
              Delete
            </button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>

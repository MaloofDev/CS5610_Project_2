<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browse Packages · LicenseLens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/browse.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <header id="site-nav"></header>
    <main class="container py-4">
      <!-- Placeholder until Browse & Search is built. -->
      <h1 class="h2">Browse Packages</h1>
      <form class="hstack gap-2 py-3" role="search">
        <input
          class="form-control"
          type="search"
          placeholder="Search by Package Name"
          aria-label="Search"
        />
        <button type="button" class="btn btn-primary">Search</button>
      </form>
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <select id="ecosystem" class="form-select w-auto">
          <option value="">Ecosystem</option>
          <option value="npm">npm</option>
          <option value="pypi">pypi</option>
          <option value="packagist">packagist</option>
        </select>
        <select id="tags" class="form-select w-auto">
          <option value="">Tag</option>
          <option value="npm">Select an Ecosystem</option>
          <option value="pypi">Select an Ecosystem</option>
          <option value="packagist">Select an Ecosystem</option>
        </select>
        <select id="licenseType" class="form-select w-auto">
          <option value="">License Type</option>
          <option value="npm">Select an Ecosystem</option>
          <option value="pypi">Select an Ecosystem</option>
          <option value="packagist">Select an Ecosystem</option>
        </select>
        <a id="clear" class="btn btn-secondary btn-sm" href="/packages"
          >Clear</a
        >
        <p href="/package-form.html" class="btn btn-light ms-auto">
          + Add Package
        </p>
      </div>
      <div id="packages" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <p>Loading packages...</p>
      </div>
      <div
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 py-3 left-child"
      >
        <div id="pageCount" class="col"></div>
        <div
          class="btn-group right-child"
          role="group"
          aria-label="Basic outlined example"
        >
          <button id="previous" type="button" class="btn btn-outline-primary">
            Previous
          </button>
          <button id="next" type="button" class="btn btn-outline-primary">
            Next
          </button>
        </div>
      </div>
    </main>
  </body>
</html>

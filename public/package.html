<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Package · LicenseLens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/package.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <header id="site-nav"></header>
    <main class="container py-4">
      <div class="row">
        <div class="pkg-column left">
          <div class="row">
            <h1 id="packageName" class="h2 col"></h1>
            <h1 id="packageVersion" class="h2 col"></h1>
            <h2 id="packageEcosystem" class="h2 col"></h2>
          </div>
          <div class="row">
            <p id="packageLicense"></p>
            <p id="packageLicenseType"></p>
          </div>
          <div class="row border border-3 form-control-lg rounded-3">
            <p id="packageDescription"></p>
          </div>
          <br>
          <div class="row">
            <p class="text-md-start fw-semibold upper">Tags</p>
            <p id="packageTags"></p>
          </div>
          <div class="row"></div>
          <div class="row py-3"></div>
        </div>
        <div class="pkg-column right">
          <p class="text-md-start fw-semibold upper">Home Page</p>
          <p class="text-sm-start fw-light lower">http://localhost:3000/package.html?</p>
          <p class="text-md-start fw-semibold upper">Repository</p>
          <p class="text-sm-start fw-light lower">https://github.com/vputiri2024</p>
          <p class="text-md-start fw-semibold upper">License</p>
          <p class="text-sm-start fw-light lower">MIT</p>
          <p class="text-md-start fw-semibold upper">Version</p>
          <p class="text-sm-start fw-light lower">7.04</p>
          <p class="text-md-start fw-semibold upper">Ecosystem</p>
          <p class="text-sm-start fw-light lower">npm</p>
          <br>
          <div>
            <button id="editButton" type="submit" class="btn btn-primary">
              Edit Details
            </button>
            <button id="deleteButton" type="submit" class="btn btn-danger">
              Delete
            </button>
          </div>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>

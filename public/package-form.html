<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Package · LicenseLens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/package-form.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <header id="site-nav"></header>
    <main class="container py-4">
      <h1 class="h2">Add Package</h1>
      <form>
        <div class="row py-2">
          <div class="col">
            <label class="form-label">Package Name</label>
            <input type="text" class="form-control" aria-label="Package Name" />
          </div>
          <div class="col">
            <label class="form-label">Ecosystem</label>
            <input type="text" class="form-control" aria-label="Ecosystem" />
          </div>
          <div class="col">
            <label class="form-label">License</label>
            <input type="text" class="form-control" aria-label="License" />
          </div>
        </div>
        <div class="row py-3">
          <div class="col">
            <label class="form-label">Version</label>
            <input type="text" class="form-control" aria-label="Version" />
          </div>
          <div class="col">
            <label class="form-label">Homepage</label>
            <input type="text" class="form-control" aria-label="Homepage" />
          </div>
          <div class="col">
            <label class="form-label">Repository</label>
            <input
              type="text"
              class="form-control"
              aria-label="Repository url"
            />
          </div>
        </div>
        <div class="row">
          <div class="mb-3 py-2">
            <label for="exampleFormControlInput1" class="form-label"
              >Email address</label
            >
            <input
              type="Tags, separated by commas"
              class="form-control"
              id="exampleFormControlInput1"
              placeholder="name@example.com"
            />
          </div>
          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label"
              >Description</label
            >
            <textarea
              class="form-control"
              id="exampleFormControlTextarea1"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="row py-3"></div>
        <button id="create" type="submit" class="btn btn-primary">
          Add Package
        </button>
        <button id="cancel" type="submit" class="btn btn-secondary">
          Cancel
        </button>
      </form>
    </main>
  </body>
</html>

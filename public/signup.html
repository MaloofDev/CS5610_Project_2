<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · LicenseLens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <header id="site-nav"></header>
    <main class="container py-4">
      <div class="row justify-content-center">
        <section class="col-sm-10 col-md-7 col-lg-5">
          <div class="card card-body p-4 shadow-sm">
            <h1 class="h2">Sign up</h1>
            <form id="auth-form" data-mode="signup" class="vstack gap-3">
              <div>
                <label for="username" class="form-label">Username</label>
                <input
                  id="username"
                  name="username"
                  type="text"
                  class="form-control"
                  autocomplete="username"
                  minlength="3"
                  maxlength="30"
                  pattern="[A-Za-z0-9_.\-]+"
                  title="Letters, numbers, dots, dashes, or underscores"
                  required
                />
              </div>
              <div>
                <label for="password" class="form-label">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control"
                  autocomplete="new-password"
                  minlength="8"
                  aria-describedby="password-hint"
                  required
                />
                <div id="password-hint" class="form-text">
                  At least 8 characters.
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Sign up</button>
              <p id="auth-error" class="text-danger mb-0" role="alert"></p>
            </form>
            <p class="mb-0">
              Already have an account?
              <a id="switch-mode" href="/login.html">Log in</a>
            </p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · LicenseLens</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/buttons.css" />
    <link rel="stylesheet" href="/css/cards.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body>
    <header id="site-nav"></header>
    <main class="container">
      <section class="card auth-card">
        <h1>Sign up</h1>
        <form id="auth-form" data-mode="signup" class="form">
          <label class="field">
            <span>Username</span>
            <input
              name="username"
              type="text"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9_.\-]+"
              title="Letters, numbers, dots, dashes, or underscores"
              required
            />
          </label>
          <label class="field">
            <span>Password</span>
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <small class="field-hint">At least 8 characters.</small>
          </label>
          <button type="submit" class="button button-primary">Sign up</button>
          <p id="auth-error" class="form-error" role="alert"></p>
        </form>
        <p class="auth-switch">
          Already have an account?
          <a id="switch-mode" href="/login.html">Log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
